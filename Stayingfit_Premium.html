<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stayingfit — Premium Nutrition Coaching Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafaf9;
            color: #1a1a1a;
            line-height: 1.6;
        }

        /* Color System */
        :root {
            --primary: #1f5233;      /* Forest Green */
            --primary-light: #2d7a3e;
            --primary-dark: #154329;
            --secondary: #2c5282;    /* Slate Blue */
            --accent: #a16207;       /* Warm Sage accent */
            --neutral-50: #fafaf9;
            --neutral-100: #f5f5f4;
            --neutral-200: #e7e5e4;
            --neutral-300: #d6d3d1;
            --neutral-400: #a8a29e;
            --neutral-500: #78716b;
            --neutral-600: #57534e;
            --neutral-700: #44403c;
            --neutral-800: #292524;
            --success: #16a34a;
            --warning: #ea580c;
            --danger: #dc2626;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header Navigation */
        header {
            background: white;
            border-bottom: 1px solid var(--neutral-200);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .user-menu {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .user-badge {
            font-size: 13px;
            color: var(--neutral-600);
            padding: 8px 12px;
            background: var(--neutral-100);
            border-radius: 4px;
        }

        button {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-light);
        }

        button.secondary {
            background: var(--neutral-200);
            color: var(--neutral-800);
        }

        button.secondary:hover {
            background: var(--neutral-300);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 0;
            background: white;
            border-bottom: 1px solid var(--neutral-200);
            margin-bottom: 32px;
        }

        .nav-tab {
            padding: 12px 20px;
            background: none;
            border: none;
            color: var(--neutral-600);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Content Sections */
        .page { display: none; }
        .page.active { display: block; }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--neutral-800);
        }

        /* Cards & Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        }

        .card {
            background: white;
            border: 1px solid var(--neutral-200);
            border-radius: 6px;
            padding: 24px;
            transition: border-color 0.2s;
        }

        .card:hover {
            border-color: var(--neutral-300);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--neutral-600);
            margin-bottom: 16px;
        }

        /* Stat Display */
        .stat-block {
            margin-bottom: 20px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--neutral-600);
            font-weight: 500;
        }

        /* Client/Diet List */
        .item-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            padding: 16px;
            background: var(--neutral-50);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .item-row:hover {
            background: var(--neutral-100);
        }

        .item-name {
            font-weight: 500;
            color: var(--neutral-800);
        }

        .item-meta {
            font-size: 12px;
            color: var(--neutral-500);
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-urgent { background: #fee2e2; color: #991b1b; }
        .badge-due { background: #fef3c7; color: #92400e; }
        .badge-active { background: #dcfce7; color: #15803d; }
        .badge-pending { background: #e0e7ff; color: #3730a3; }

        /* Alert Boxes */
        .alert {
            padding: 16px;
            border-radius: 6px;
            border-left: 4px solid;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
        }

        .alert-warning {
            background: #fffbeb;
            border-left-color: var(--warning);
            color: #92400e;
        }

        .alert-success {
            background: #f0fdf4;
            border-left-color: var(--success);
            color: #15803d;
        }

        /* Forms */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--neutral-600);
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--neutral-300);
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(31, 82, 51, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 12px;
            background: var(--neutral-50);
            border-bottom: 1px solid var(--neutral-200);
            font-weight: 600;
            color: var(--neutral-700);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--neutral-100);
            color: var(--neutral-700);
        }

        tr:hover { background: var(--neutral-50); }

        /* Charts */
        .chart-container {
            position: relative;
            height: 300px;
            margin: 24px 0;
        }

        /* Two Column */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .two-col, .form-row, .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }

        .login-card {
            background: white;
            border-radius: 8px;
            padding: 48px;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .login-card h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .login-card p {
            font-size: 13px;
            color: var(--neutral-600);
            margin-bottom: 32px;
        }

        .login-card button {
            width: 100%;
            margin-bottom: 12px;
        }

        /* Utility */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mt-20 { margin-top: 20px; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Client Data with realistic health metrics
        const clientsData = {
            1: {
                id: 1,
                name: "Aisha Gupta",
                phone: "98765 43210",
                email: "aisha@example.com",
                condition: "Weight Loss",
                age: 34,
                planStart: "2026-08-15",
                planEnd: "2026-09-15",
                subscriptionEnd: "2026-09-28",
                daysLeft: 15,
                status: "Active",
                weightHistory: [
                    { date: "2026-09-01", value: 72 },
                    { date: "2026-09-04", value: 71.5 },
                    { date: "2026-09-07", value: 71 },
                    { date: "2026-09-10", value: 70.2 },
                    { date: "2026-09-13", value: 68.5 }
                ],
                bloodSugar: [
                    { date: "2026-09-12", fasting: 105, postMeal: 140 },
                    { date: "2026-09-13", fasting: 103, postMeal: 135 }
                ],
                bloodTests: [
                    { date: "2026-08-15", hba1c: 5.8, ldl: 145, hdl: 42, triglycerides: 165 },
                    { date: "2026-09-13", hba1c: 5.5, ldl: 140, hdl: 45, triglycerides: 155 }
                ],
                adherence: 87,
                energyLevel: 8,
                notes: "Responding well to plan. Improved energy levels. Consistent with meals."
            },
            2: {
                id: 2,
                name: "Raj Patel",
                phone: "98765 43211",
                email: "raj@example.com",
                condition: "Diabetes Management",
                age: 52,
                planStart: "2026-09-05",
                planEnd: "2026-10-05",
                subscriptionEnd: "2026-10-02",
                daysLeft: 19,
                status: "Active",
                weightHistory: [
                    { date: "2026-09-05", value: 85 },
                    { date: "2026-09-08", value: 84.8 },
                    { date: "2026-09-11", value: 84.5 },
                    { date: "2026-09-13", value: 82 }
                ],
                bloodSugar: [
                    { date: "2026-09-12", fasting: 145, postMeal: 185 },
                    { date: "2026-09-13", fasting: 142, postMeal: 178 }
                ],
                bloodTests: [
                    { date: "2026-09-05", hba1c: 7.8, ldl: 165, hdl: 38, triglycerides: 220 },
                    { date: "2026-09-13", hba1c: 7.2, ldl: 158, hdl: 40, triglycerides: 205 }
                ],
                adherence: 72,
                energyLevel: 6,
                notes: "Fasting glucose trending down. HbA1c improving. Continue current plan."
            },
            3: {
                id: 3,
                name: "Meera Singh",
                phone: "98765 43212",
                email: "meera@example.com",
                condition: "Maintenance",
                age: 41,
                planStart: "2026-08-20",
                planEnd: "2026-09-20",
                subscriptionEnd: "2026-09-19",
                daysLeft: 6,
                status: "Expiring",
                weightHistory: [
                    { date: "2026-08-20", value: 65.2 },
                    { date: "2026-08-27", value: 65.1 },
                    { date: "2026-09-03", value: 65 },
                    { date: "2026-09-10", value: 65 },
                    { date: "2026-09-13", value: 64.9 }
                ],
                bloodSugar: [],
                bloodTests: [
                    { date: "2026-08-20", hba1c: 5.2, ldl: 120, hdl: 55, triglycerides: 95 },
                    { date: "2026-09-13", hba1c: 5.1, ldl: 118, hdl: 56, triglycerides: 92 }
                ],
                adherence: 95,
                energyLevel: 9,
                notes: "Excellent compliance. Weight stable. Health markers excellent."
            }
        };

        let currentUser = null;
        let currentTab = "dashboard";
        let selectedClientId = 1;

        const app = document.getElementById("app");

        function render() {
            if (!currentUser) renderLogin();
            else if (currentUser === "coach") renderCoachDashboard();
            else renderClientDashboard();
        }

        function renderLogin() {
            app.innerHTML = `
                <div class="login-screen">
                    <div class="login-card text-center">
                        <h1>Stayingfit</h1>
                        <p>Premium Nutrition Coaching Platform</p>
                        <button onclick="login('coach')">Coach Dashboard</button>
                        <button class="secondary" onclick="login('client')">Client Portal</button>
                    </div>
                </div>
            `;
        }

        function renderCoachDashboard() {
            const clients = Object.values(clientsData);
            const today = new Date("2026-09-13");
            const expiringSoon = clients.filter(c => c.daysLeft <= 5);
            const dietsDueToday = clients.filter(c => {
                const planEndDate = new Date(c.planEnd);
                return planEndDate <= today && c.status !== "Expired";
            });

            app.innerHTML = `
                <header>
                    <div class="container">
                        <div class="logo">Stayingfit</div>
                        <div class="user-menu">
                            <div class="user-badge">Coach • Pushpanjali</div>
                            <button onclick="logout()" class="secondary">Logout</button>
                        </div>
                    </div>
                </header>

                <div class="container" style="padding-top: 32px;">
                    <div class="nav-tabs">
                        <button class="nav-tab ${currentTab === 'dashboard' ? 'active' : ''}" onclick="setTab('dashboard')">Dashboard</button>
                        <button class="nav-tab ${currentTab === 'diet-schedule' ? 'active' : ''}" onclick="setTab('diet-schedule')">Diet Scheduler</button>
                        <button class="nav-tab ${currentTab === 'clients' ? 'active' : ''}" onclick="setTab('clients')">All Clients</button>
                    </div>

                    ${currentTab === 'dashboard' ? `
                        <div class="section">
                            ${expiringSoon.length > 0 ? `
                                <div class="alert alert-warning">
                                    <strong>${expiringSoon.length} subscription${expiringSoon.length > 1 ? 's' : ''} expiring in next 5 days.</strong> Send renewal reminders.
                                </div>
                            ` : ''}
                            ${dietsDueToday.length > 0 ? `
                                <div class="alert alert-warning">
                                    <strong>${dietsDueToday.length} diet plan${dietsDueToday.length > 1 ? 's' : ''} due today.</strong> Send updated plans.
                                </div>
                            ` : ''}

                            <div class="section-title">Overview</div>
                            <div class="grid grid-2">
                                <div class="card">
                                    <div class="card-title">Active Clients</div>
                                    <div class="stat-value">${clients.length}</div>
                                    <div class="stat-label">Currently in programs</div>
                                </div>
                                <div class="card">
                                    <div class="card-title">Average Adherence</div>
                                    <div class="stat-value">${Math.round(clients.reduce((a, b) => a + b.adherence, 0) / clients.length)}%</div>
                                    <div class="stat-label">Last 7 days</div>
                                </div>
                            </div>
                        </div>

                        <div class="section">
                            <div class="section-title">Client Progress</div>
                            <div class="grid">
                                ${clients.map(c => `
                                    <div class="card">
                                        <div class="item-name">${c.name}</div>
                                        <div class="item-meta">${c.condition}</div>
                                        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--neutral-200);">
                                            <div class="stat-block">
                                                <div class="stat-label">Current Weight</div>
                                                <div class="stat-value">${c.weightHistory[c.weightHistory.length - 1].value} kg</div>
                                            </div>
                                            <div class="stat-block">
                                                <div class="stat-label">Adherence</div>
                                                <div style="font-size: 16px; font-weight: 600; color: var(--primary);">${c.adherence}%</div>
                                            </div>
                                            <div style="margin-top: 12px;">
                                                <span class="badge ${c.daysLeft <= 5 ? 'badge-due' : 'badge-active'}">${c.daysLeft} days left</span>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : currentTab === 'diet-schedule' ? `
                        <div class="section">
                            <div class="section-title">Diet Cycle Tracker</div>
                            <div class="card">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Client Name</th>
                                            <th>Condition</th>
                                            <th>Current Plan Ends</th>
                                            <th>Days Until Due</th>
                                            <th>Subscription Ends</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${clients.map(c => {
                                            const planEndDate = new Date(c.planEnd);
                                            const daysUntilDue = Math.floor((planEndDate - today) / (1000 * 60 * 60 * 24));
                                            return `
                                                <tr>
                                                    <td><strong>${c.name}</strong></td>
                                                    <td>${c.condition}</td>
                                                    <td>${c.planEnd}</td>
                                                    <td>
                                                        <span class="badge ${daysUntilDue <= 0 ? 'badge-urgent' : 'badge-active'}">
                                                            ${daysUntilDue <= 0 ? 'DUE TODAY' : daysUntilDue + ' days'}
                                                        </span>
                                                    </td>
                                                    <td>${c.subscriptionEnd}</td>
                                                    <td><button style="padding: 6px 12px; font-size: 11px;">Send Plan</button></td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    ` : `
                        <div class="section">
                            <div class="section-title">All Clients</div>
                            <div class="grid">
                                ${clients.map(c => `
                                    <div class="card" style="cursor: pointer;" onclick="selectAndShowClient(${c.id})">
                                        <div class="item-name">${c.name}</div>
                                        <div class="item-meta">${c.condition} • ${c.age} years</div>
                                        <div style="margin-top: 16px; display: flex; gap: 8px;">
                                            <div style="flex: 1;">
                                                <div class="stat-label">Weight</div>
                                                <div style="font-weight: 600; color: var(--primary);">${c.weightHistory[c.weightHistory.length - 1].value} kg</div>
                                            </div>
                                            <div style="flex: 1;">
                                                <div class="stat-label">Adherence</div>
                                                <div style="font-weight: 600; color: var(--primary);">${c.adherence}%</div>
                                            </div>
                                        </div>
                                        <div style="margin-top: 12px;">
                                            <span class="badge ${c.status === 'Expiring' ? 'badge-due' : 'badge-active'}">${c.status}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        function renderClientDashboard() {
            const client = clientsData[selectedClientId];
            const latestWeight = client.weightHistory[client.weightHistory.length - 1];
            const weightTrend = client.weightHistory.length > 1
                ? client.weightHistory[client.weightHistory.length - 1].value - client.weightHistory[0].value
                : 0;
            const latestBloodTest = client.bloodTests[client.bloodTests.length - 1];

            app.innerHTML = `
                <header>
                    <div class="container">
                        <div class="logo">Stayingfit</div>
                        <div class="user-menu">
                            <div class="user-badge">${client.name}</div>
                            <button onclick="logout()" class="secondary">Logout</button>
                        </div>
                    </div>
                </header>

                <div class="container" style="padding-top: 32px;">
                    ${client.daysLeft <= 5 ? `
                        <div class="alert alert-warning">
                            <strong>Subscription renewing in ${client.daysLeft} days.</strong> Renew now to avoid service interruption.
                        </div>
                    ` : ''}

                    <div class="section-title">${client.name}'s Progress</div>

                    <div class="two-col" style="margin-bottom: 32px;">
                        <div class="card">
                            <div class="card-title">Subscription Status</div>
                            <div class="stat-block">
                                <div class="stat-label">Days Remaining</div>
                                <div class="stat-value">${client.daysLeft}</div>
                            </div>
                            <div class="stat-block">
                                <div class="stat-label">Renewal Date</div>
                                <div style="font-weight: 600; color: var(--neutral-800);">${client.subscriptionEnd}</div>
                            </div>
                            <button style="width: 100%; margin-top: 16px;">Renew Subscription</button>
                        </div>

                        <div class="card">
                            <div class="card-title">Current Plan</div>
                            <div class="stat-block">
                                <div class="stat-label">Plan Type</div>
                                <div style="font-weight: 600; color: var(--neutral-800);">${client.condition}</div>
                            </div>
                            <div class="stat-block">
                                <div class="stat-label">Plan Duration</div>
                                <div style="font-weight: 600; color: var(--neutral-800);">${client.planStart} to ${client.planEnd}</div>
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">Health Metrics</div>
                        <div class="grid">
                            <div class="card">
                                <div class="card-title">Weight Trend</div>
                                <div class="stat-value">${latestWeight.value} kg</div>
                                <div class="stat-label">
                                    ${weightTrend < 0 ? '📉' : '📈'}
                                    ${Math.abs(weightTrend).toFixed(1)} kg ${weightTrend < 0 ? 'lost' : 'gained'} since start
                                </div>
                                <div id="weightChart" class="chart-container"></div>
                            </div>

                            <div class="card">
                                <div class="card-title">Blood Test Markers</div>
                                <table style="font-size: 12px;">
                                    <tr>
                                        <td style="padding: 8px; border: none;"><strong>HbA1c</strong></td>
                                        <td style="padding: 8px; border: none; text-align: right; color: var(--primary); font-weight: 600;">${latestBloodTest.hba1c}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px; border: none;"><strong>LDL</strong></td>
                                        <td style="padding: 8px; border: none; text-align: right; color: var(--primary); font-weight: 600;">${latestBloodTest.ldl}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px; border: none;"><strong>HDL</strong></td>
                                        <td style="padding: 8px; border: none; text-align: right; color: var(--primary); font-weight: 600;">${latestBloodTest.hdl}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 8px; border: none;"><strong>Triglycerides</strong></td>
                                        <td style="padding: 8px; border: none; text-align: right; color: var(--primary); font-weight: 600;">${latestBloodTest.triglycerides}</td>
                                    </tr>
                                </table>
                            </div>

                            <div class="card">
                                <div class="card-title">Today's Metrics</div>
                                <div class="stat-block">
                                    <div class="stat-label">Adherence</div>
                                    <div style="font-size: 24px; font-weight: 700; color: var(--primary);">${client.adherence}%</div>
                                </div>
                                <div class="stat-block">
                                    <div class="stat-label">Energy Level</div>
                                    <div style="font-size: 24px; font-weight: 700; color: var(--primary);">${client.energyLevel}/10</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">Log Today's Progress</div>
                        <div class="card">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Weight (kg)</label>
                                    <input type="number" value="${latestWeight.value}" placeholder="68.5" step="0.1" />
                                </div>
                                <div class="form-group">
                                    <label>Energy Level (1-10)</label>
                                    <input type="number" min="1" max="10" value="${client.energyLevel}" />
                                </div>
                            </div>
                            ${client.condition === 'Diabetes Management' ? `
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Fasting Blood Sugar (mg/dL)</label>
                                        <input type="number" placeholder="120" />
                                    </div>
                                    <div class="form-group">
                                        <label>Post-Meal Blood Sugar (mg/dL)</label>
                                        <input type="number" placeholder="160" />
                                    </div>
                                </div>
                            ` : ''}
                            <div class="form-group">
                                <label>Notes</label>
                                <textarea rows="3" placeholder="How did you feel today?"></textarea>
                            </div>
                            <button>Log Progress</button>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">Coach Notes</div>
                        <div class="card">
                            <p style="color: var(--neutral-700); line-height: 1.6;">${client.notes}</p>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">Message Your Coach</div>
                        <div class="card">
                            <button style="width: 100%;">Open Chat with Pushpanjali</button>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                const ctx = document.getElementById('weightChart');
                if (ctx) {
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: client.weightHistory.map(h => h.date.substring(5)),
                            datasets: [{
                                label: 'Weight (kg)',
                                data: client.weightHistory.map(h => h.value),
                                borderColor: 'var(--primary)',
                                backgroundColor: 'rgba(31, 82, 51, 0.05)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 4,
                                pointBackgroundColor: 'var(--primary)',
                                pointBorderColor: 'white',
                                pointBorderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: { beginAtZero: false, ticks: { font: { size: 11 } } },
                                x: { ticks: { font: { size: 11 } } }
                            }
                        }
                    });
                }
            }, 100);
        }

        function login(role) { currentUser = role; currentTab = "dashboard"; selectedClientId = 1; render(); }
        function logout() { currentUser = null; render(); }
        function setTab(tab) { currentTab = tab; render(); }
        function selectAndShowClient(id) { currentUser = "client"; selectedClientId = id; currentTab = "progress"; render(); }

        render();
    </script>
</body>
</html>
